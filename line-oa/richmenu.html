<!DOCTYPE html>
<!-- ต้นฉบับรูป rich menu ของ LINE OA (2500×1686) · แก้ที่นี่แล้วถ่ายใหม่: node line-oa/render-richmenu.mjs
     ผังต้องตรงกับ areas ใน richmenu.json (3 คอลัมน์ × 2 แถว) · สี/ไอคอนชุดเดียวกับเว็บ (shared.css, js/tabbar.js) -->
<html lang="th"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;700&display=block" rel="stylesheet">
<style>
  :root{--ink:#171a1f;--ink-3:#5f636a;--paper:#f1f1ec;--yellow:#ffc533;--data:#2d6aa3;--danger:#be123c;--line:#d9d9d2}
  *{box-sizing:border-box;margin:0}
  html,body{width:2500px;height:1686px;background:var(--line)}
  body{display:grid;grid-template-columns:833px 833px 834px;grid-template-rows:843px 843px;gap:0;font-family:'Anuphan','Noto Sans Thai',sans-serif;color:var(--ink)}
  .c{background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;
     border-right:6px solid var(--line);border-bottom:6px solid var(--line);position:relative}
  .c:nth-child(3n){border-right:0} .c:nth-child(n+4){border-bottom:0}
  .ic{width:290px;height:290px;border-radius:72px;background:#fff;display:flex;align-items:center;justify-content:center}
  .ic svg{width:190px;height:190px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .t{font-size:104px;font-weight:700;line-height:1.05;text-align:center;letter-spacing:-1px}
  .s{font-size:60px;font-weight:500;color:var(--ink-3);line-height:1;margin-top:-26px}
  .main .ic{background:var(--yellow)}
  .sos{background:var(--danger);color:#fff}
  .sos .t{font-size:92px}
  .sos .ic{background:rgba(255,255,255,.16)} .sos .ic svg{stroke:#fff} .sos .s{color:rgba(255,255,255,.85)}
</style></head>
<body>
  <div class="c main"><div class="ic"><svg viewBox="0 0 24 24"><path d="M2.8 8.4c2.3-2.1 4.6-2.1 6.9 0s4.6 2.1 6.9 0 4.6-2.1 4.6 0"/><path d="M2.8 13.4c2.3-2.1 4.6-2.1 6.9 0s4.6 2.1 6.9 0 4.6-2.1 4.6 0"/><path d="M2.8 18.4c2.3-2.1 4.6-2.1 6.9 0s4.6 2.1 6.9 0 4.6-2.1 4.6 0"/></svg></div>
    <div class="t">สถานการณ์น้ำ</div><div class="s">ตอนนี้ ทั้งจังหวัด</div></div>
  <div class="c"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></div>
    <div class="t">ใกล้ฉัน</div><div class="s">ส่งตำแหน่ง</div></div>
  <div class="c"><div class="ic"><svg viewBox="0 0 24 24"><path d="M9 4 3 6.4v13.2L9 17.2l6 2.4 6-2.4V4l-6 2.4z"/><path d="M9 4v13.2"/><path d="M15 6.4v13.2"/></svg></div>
    <div class="t">แผนที่น้ำ</div><div class="s">naraflood.com</div></div>
  <div class="c"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 10.6 12 4l8 6.6"/><path d="M6 9.9V20h12V9.9"/><path d="M9.4 20v-4.4h5.2V20"/><path d="M12 8.6v3"/></svg></div>
    <div class="t">ศูนย์พักพิง</div><div class="s">และที่จอดรถ</div></div>
  <div class="c"><div class="ic"><svg viewBox="0 0 24 24"><path d="M7.2 18.5h9.4a3.8 3.8 0 0 0 .5-7.6 5.4 5.4 0 0 0-10.3-1.2 3.9 3.9 0 0 0 .4 8.8z"/></svg></div>
    <div class="t">คาดการณ์ฝน</div><div class="s">7 วันข้างหน้า</div></div>
  <div class="c sos"><div class="ic"><svg viewBox="0 0 24 24"><path d="M6.6 3.6h2.9l1.5 4.1-2 1.4a11.4 11.4 0 0 0 5.9 5.9l1.4-2 4.1 1.5v2.9a1.9 1.9 0 0 1-2 1.9A15.8 15.8 0 0 1 4.6 5.6a1.9 1.9 0 0 1 2-2z"/></svg></div>
    <div class="t">ขอความช่วยเหลือ</div><div class="s">โทร 1784</div></div>
</body></html>
