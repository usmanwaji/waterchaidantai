<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>NaraFlood rich menu 2500×1686</title>
<!-- ต้นฉบับรูป rich menu · ขนาดจริง 2500×1686 px · ถ่ายใหม่ด้วยคำสั่งใน line-oa/README.md
     สีคัดจาก token ใน shared.css (paper, card, ink, line, st-danger) · ไอคอนชุดเดียวกับ js/tabbar.js
     ผังช่องต้องตรงกับ bounds ใน richmenu.json (3 คอลัมน์ 833/834/833 × 2 แถว 843) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&display=block" rel="stylesheet">
<style>
  :root{
    --paper:#f1f1ec; --card:#ffffff; --ink:#171a1f; --ink-3:#5f636a; --line:#d9d9d2;
    --data:#1d4ed8; --st-danger:#be123c;
  }
  *{box-sizing:border-box;margin:0}
  html,body{width:2500px;height:1686px;overflow:hidden;background:var(--paper)}
  body{font-family:'Anuphan','Noto Sans Thai','Leelawadee UI',sans-serif;color:var(--ink);
    display:grid;grid-template-columns:833px 834px 833px;grid-template-rows:843px 843px}
  .cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    background:var(--card);border-right:6px solid var(--paper);border-bottom:6px solid var(--paper);text-align:center;padding:0 40px}
  .cell:nth-child(3n){border-right:0}
  .cell:nth-child(n+4){border-bottom:0}
  svg{width:250px;height:250px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .cell.main svg{stroke:var(--data)}
  b{font-size:112px;font-weight:700;white-space:nowrap;line-height:1.08;letter-spacing:-1px}
  small{font-size:60px;font-weight:500;white-space:nowrap;color:var(--ink-3);line-height:1.1}
  .cell.sos{background:var(--st-danger);color:#fff}
  .cell.sos svg{stroke:#fff}
  .cell.sos small{color:#ffe4e6}
</style>
</head>
<body>
  <div class="cell main">
    <svg viewBox="0 0 24 24"><path d="M2.8 8.4c2.3-2.1 4.6-2.1 6.9 0s4.6 2.1 6.9 0 4.6-2.1 4.6 0"/><path d="M2.8 13.4c2.3-2.1 4.6-2.1 6.9 0s4.6 2.1 6.9 0 4.6-2.1 4.6 0"/><path d="M2.8 18.4c2.3-2.1 4.6-2.1 6.9 0s4.6 2.1 6.9 0 4.6-2.1 4.6 0"/></svg>
    <b>สถานการณ์น้ำ</b><small>ตอนนี้ทั้งจังหวัด</small>
  </div>
  <div class="cell main">
    <svg viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
    <b>ใกล้ฉัน</b><small>ส่งตำแหน่ง ดูจุดใกล้คุณ</small>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24"><path d="M9 4 3 6.4v13.2L9 17.2l6 2.4 6-2.4V4l-6 2.4z"/><path d="M9 4v13.2"/><path d="M15 6.4v13.2"/></svg>
    <b>แผนที่น้ำ</b><small>ระดับน้ำทุกสถานี</small>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24"><path d="M4 10.6 12 4l8 6.6"/><path d="M6 9.9V20h12V9.9"/><path d="M9.4 20v-4.4h5.2V20"/><path d="M12 8.6v3"/></svg>
    <b>ศูนย์พักพิง</b><small>และที่จอดรถหนีน้ำ</small>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24"><path d="M7.2 18.5h9.4a3.8 3.8 0 0 0 .5-7.6 5.4 5.4 0 0 0-10.3-1.2 3.9 3.9 0 0 0 .4 8.8z"/></svg>
    <b>คาดการณ์ฝน</b><small>พื้นที่เสี่ยง 7 วัน</small>
  </div>
  <div class="cell sos">
    <svg viewBox="0 0 24 24"><path d="M6.6 3.6h2.9l1.5 4.2-2 1.4a11.6 11.6 0 0 0 5.8 5.8l1.4-2 4.2 1.5v2.9a2 2 0 0 1-2.2 2C10.6 18.8 5.2 13.4 4.6 5.8a2 2 0 0 1 2-2.2z"/></svg>
    <b>โทร 1784</b><small>ขอความช่วยเหลือ 24 ชม.</small>
  </div>
</body>
</html>
