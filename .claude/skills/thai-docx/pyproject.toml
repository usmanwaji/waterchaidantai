[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thai-docx"
version = "0.1.0"
description = "Fix Thai-language rendering in Word (.docx) files generated by python-docx — complex-script font/size/bidi enforcement, ZWSP word-break, PDF text cleanup."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "x-team / thai-docx" }]
keywords = [
    "thai", "docx", "python-docx", "complex-script", "w:cs", "szCs",
    "TH Sarabun", "tone-marks", "word", "office-open-xml",
]
dependencies = [
    # Pin below 2.0: we touch private API (Part._blob in fonts.py) that a major
    # bump could change without notice.
    "python-docx>=1.0,<2.0",
    # Used directly (import lxml.etree in fonts.py); it only arrives transitively
    # via python-docx, so declare it explicitly.
    "lxml>=4.0",
]

[project.optional-dependencies]
# pythainlp powers ZWSP word-break (insert_thai_breaks). Without it those
# features gracefully skip with a warning — everything else still works.
nlp = ["pythainlp>=4.0.0"]
dev = ["pytest>=7.0", "pythainlp>=4.0.0"]

[project.scripts]
verify-thai-docx = "thai_docx.verify_thai_docx:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
