<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#171a1f;font-family:Anuphan,sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#252a32 0%,#171a1f 60%,#0d0f12 100%)}
.abs{position:absolute}
.center{left:0;right:0;text-align:center}
#water{position:absolute;left:0;top:0;width:1080px;height:1920px}
.hl{background:linear-gradient(transparent 58%,#ffc533 58%,#ffc533 92%,transparent 92%);color:#fff;padding:0 6px}
#hook1{top:620px;font-size:84px;font-weight:700;line-height:1.25}
#hook2{top:820px;font-size:104px;font-weight:700;line-height:1.2;color:#ffc533}
#logoWrap{top:640px}
#logoIcon{width:220px;height:220px;border-radius:56px;background:#ffc533;margin:0 auto;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 80px rgba(255,197,51,.25)}
#logoName{font-size:120px;font-weight:700;margin-top:48px;letter-spacing:-1px}
#logoName span{color:#ffc533}
#logoSub{font-size:50px;font-weight:500;color:#c9cdd4;margin-top:18px}
#phone{left:50%;width:680px;height:1440px;margin-left:-340px;border-radius:92px;background:#0b0c0e;padding:20px;
  box-shadow:0 0 0 4px #3a3f47,0 60px 120px rgba(0,0,0,.55);transform-origin:50% 0}
#screen{position:relative;width:640px;height:1400px;border-radius:74px;overflow:hidden;background:#f1f1ec}
.view{position:absolute;left:0;top:0;width:640px;height:1400px;overflow:hidden;background:#f1f1ec}
.view img{position:absolute;left:0;top:0;width:640px}
#notch{position:absolute;left:50%;top:18px;width:190px;height:52px;margin-left:-95px;background:#0b0c0e;border-radius:30px;z-index:5}
#cap{top:100px;left:70px;right:70px}
#kicker{display:inline-block;background:#ffc533;color:#171a1f;font-weight:700;font-size:38px;padding:8px 26px;border-radius:40px}
#kicker.red{background:#be123c;color:#fff}
#step{position:absolute;right:70px;top:100px;font-size:34px;font-weight:700;color:#8b8e94;letter-spacing:2px}
#step b{color:#ffc533}
#title{font-size:74px;font-weight:700;line-height:1.18;margin-top:20px}
#sub{font-size:38px;font-weight:500;color:#c9cdd4;margin-top:12px}
#flash{left:0;top:0;width:1080px;height:1920px;background:#fff;pointer-events:none}
#cta{top:250px}
#ctaSmall{font-size:52px;font-weight:600;color:#c9cdd4}
#ctaUrl{font-size:132px;font-weight:700;margin-top:10px;letter-spacing:-2px}
#ctaUrl span{color:#ffc533}
#ctaPills{margin-top:40px;display:flex;flex-wrap:wrap;gap:18px;justify-content:center;padding:0 80px}
.pill{font-size:40px;font-weight:600;padding:14px 32px;border-radius:50px;background:#2a2f37;color:#fff}
#qrBox{margin:60px auto 0;width:400px;background:#fff;border-radius:40px;padding:34px}
#qrBox img{width:332px;display:block}
#qrBox div{color:#171a1f;font-size:34px;font-weight:600;margin-top:12px}
#sos{margin:50px auto 0;display:inline-flex;align-items:center;gap:20px;background:#be123c;border-radius:60px;padding:22px 48px;font-size:48px;font-weight:700}
#share{margin-top:34px;font-size:42px;font-weight:600;color:#ffc533}
#src{bottom:60px;font-size:30px;color:#8b8e94}
#prog{left:0;top:0;height:10px;background:#ffc533}
#subWrap{left:50px;right:50px;bottom:150px;display:flex;justify-content:center}
#subt{white-space:nowrap;text-align:center;font-size:50px;font-weight:700;line-height:1.35;color:#fff;
  background:rgba(13,15,18,.86);padding:14px 34px 18px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.35);
  border-bottom:6px solid #ffc533}
</style></head><body>
<div id="stage">
  <svg id="water" viewBox="0 0 1080 1920"><path id="w2" fill="#1d4a75" opacity=".55"/><path id="w1" fill="#2d6aa3" opacity=".9"/></svg>

  <div id="hook1" class="abs center">ฝนตกหนักทั้งคืน…</div>
  <div id="hook2" class="abs center">น้ำจะมาถึงบ้านเราไหม?</div>

  <div id="logoWrap" class="abs center">
    <div id="logoIcon"><svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#171a1f" stroke-width="2.4" stroke-linecap="round"><path d="M2 9c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6-1"/><path d="M2 14c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6-1"/><path d="M2 19c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6-1"/></svg></div>
    <div id="logoName">nara<span>flood</span>.com</div>
    <div id="logoSub">Dashboard น้ำท่วม จังหวัดนราธิวาส</div>
  </div>

  <div id="cap" class="abs">
    <div id="kicker"></div>
    <div id="title"></div>
    <div id="sub"></div>
  </div>
  <div id="step"></div>

  <div id="phone" class="abs"><div id="screen"><div id="notch"></div>
    <div class="view" id="vB"><img id="bImg"><img id="bImg2"></div>
    <div class="view" id="vA"><img id="aImg"><img id="aImg2"></div>
  </div></div>

  <div id="cta" class="abs center">
    <div id="ctaSmall">เข้าเลยที่</div>
    <div id="ctaUrl">nara<span>flood</span>.com</div>
    <div id="ctaPills"><div class="pill">ฟรี</div><div class="pill">ไม่ต้องโหลดแอป</div><div class="pill">เปิดได้ทุกมือถือ</div><div class="pill">ติดตั้งลงหน้าจอได้</div></div>
    <div id="qrBox"><img src="qr.png"><div>สแกนเปิดเว็บ</div></div>
    <div id="sos">🆘 เหตุฉุกเฉิน โทร 1784</div>
    <div id="share">แชร์ให้คนที่คุณห่วง 💛</div>
  </div>
  <div id="src" class="abs center">ข้อมูลจาก สสน. · กรมชลประทาน · ปภ. · กรมอุตุนิยมวิทยา · GISTDA</div>
  <div id="subWrap" class="abs"><div id="subt"></div></div>
  <div id="flash" class="abs"></div>
  <div id="prog" class="abs"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const out=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const win=(t,a,b,d=.45)=>clamp((t-a)/d)*clamp((b-t)/d);
const K=640/1170;   // screenshot px (1170 wide) -> screen px
const SW=.35;       // screen slide duration
let DUR=10, SC=[], PH=[], BY={};
// scenes: [{key,type:'hook'|'logo'|'phone'|'cta',t0,t1,img,img2,scroll:[a,b],zoom:{at,x,y,s},kicker,red,title,sub}]
function setTimeline(list){ SC=list; DUR=list[list.length-1].t1; window.DUR=DUR;
  PH=list.filter(s=>s.type==='phone'); BY={}; for(const s of list) BY[s.type]=BY[s.type]||s; }
function wave(y,amp,len,ph){let d=`M0 ${y}`;for(let x=0;x<=1080;x+=20)d+=` L${x} ${y+amp*Math.sin(x/len*2*Math.PI+ph)}`;return d+' L1080 1920 L0 1920 Z'}
function setSrc(img,src){ if(!src){img.style.display='none';return} img.style.display='block'; if(img.dataset.src!==src){img.src=src;img.dataset.src=src} }
// draw scene s at local time lt into view v (imgs a,a2)
function drawScreen(v,a,a2,s,lt){
  const len=s.t1-s.t0;
  setSrc(a,s.img); setSrc(a2,s.img2);
  let y=0;
  if(s.scroll){ const p=ease((lt-.6)/Math.max(.1,len-1.6)); y=-(s.scroll[0]+(s.scroll[1]-s.scroll[0])*p)*K; }
  let op2=0; if(s.img2) op2=clamp((lt-len*.5)/.4);
  a.style.cssText=`display:block;top:${y}px;opacity:1`;
  if(s.img2) a2.style.cssText=`display:block;top:0;opacity:${op2}`;
  let z=1+0.03*ease(lt/len), ox=.5, oy=.3;
  if(s.zoom){ const zt=s.zoom.at*len; const p=ease((lt-zt)/.7); z=1+(s.zoom.s-1)*p+0.02*ease(lt/len); ox=s.zoom.x; oy=s.zoom.y; }
  v.style.transformOrigin=`${ox*100}% ${oy*100}%`; return z;
}
function render(t){
  const H=BY.logo.t0, L1=PH[0].t0, C=BY.cta.t0, H2=BY.hook.hook2??Math.min(1.0,H*.35);
  let lvl = t<H ? 1920-ease(t/(H-.2))*760 : t<L1 ? 1160+ease((t-H)/1.4)*620 : t<C ? 1780 : 1780-ease((t-C)/1.2)*90;
  $('w1').setAttribute('d',wave(lvl,22,520,t*2.6));
  $('w2').setAttribute('d',wave(lvl-26,26,700,-t*1.9+1));
  let h1=win(t,.15,H-.1,.35), h2=win(t,H2,H-.1,.35);
  $('hook1').style.cssText=`opacity:${h1};transform:translateY(${(1-out((t-.15)/.4))*50}px)`;
  $('hook2').style.cssText=`opacity:${h2};transform:translateY(${(1-out((t-H2)/.4))*50}px) scale(${.85+.15*back((t-H2)/.5)})`;
  $('logoWrap').style.opacity=win(t,H+.05,L1,.35);
  $('logoIcon').style.transform=`scale(${back((t-H-.05)/.6)}) rotate(${(1-out((t-H-.05)/.6))*-25}deg)`;
  $('logoName').style.transform=`translateY(${(1-out((t-H-.3)/.5))*60}px) scale(${.9+.1*back((t-H-.3)/.5)})`;
  $('logoName').style.opacity=clamp((t-H-.3)/.3);
  $('logoSub').style.opacity=clamp((t-H-.7)/.4);
  // phone in/out
  const PT=560, E=C-.6; let py = t<E ? 1920-out((t-(L1-.3))/.7)*(1920-PT) : PT+ease((t-E)/.7)*1500;
  $('phone').style.top=py+'px'; $('phone').style.transform='scale(.9)';
  $('phone').style.display=(t>L1-.4&&t<C+.6)?'block':'none';
  // phone scenes
  const i=PH.findIndex(s=>t>=s.t0&&t<s.t1);
  $('cap').style.display=$('step').style.display=i<0?'none':'block';
  let fl=0;
  if(i>=0){
    const s=PH[i], lt=t-s.t0;
    const capOut=i===PH.length-1?clamp((s.t1-t)/.3):1;
    $('kicker').textContent=s.kicker; $('kicker').className=s.red?'red':''; $('title').innerHTML=s.title; $('sub').textContent=s.sub||'';
    $('step').innerHTML=`<b>${String(i+1).padStart(2,'0')}</b> / ${String(PH.length).padStart(2,'0')}`;
    const ki=out(lt/.35); $('kicker').style.cssText=`opacity:${ki*capOut};transform:translateX(${(1-ki)*-50}px) scale(${.8+.2*back(lt/.4)})`;
    const ti=out((lt-.1)/.4); $('title').style.cssText=`opacity:${ti*capOut};transform:translateY(${(1-ti)*40}px)`;
    const si=out((lt-.25)/.4); $('sub').style.cssText=`opacity:${si*capOut}`;
    $('step').style.opacity=capOut;
    const zA=drawScreen($('vA'),$('aImg'),$('aImg2'),s,lt);
    if(i>0 && lt<SW){   // slide the new screen in from the right, old one out to the left
      const p=ease(lt/SW), prev=PH[i-1];
      const zB=drawScreen($('vB'),$('bImg'),$('bImg2'),prev,prev.t1-prev.t0);
      $('vA').style.transform=`translateX(${(1-p)*640}px) scale(${zA})`;
      $('vB').style.transform=`translateX(${-p*320}px) scale(${zB})`; $('vB').style.display='block';
      fl=.18*(1-lt/SW);
    } else { $('vA').style.transform=`scale(${zA})`; $('vB').style.display='none'; }
  }
  $('flash').style.opacity=fl;
  // CTA
  const c=clamp((t-C)/.4);
  $('cta').style.cssText=`opacity:${c};transform:translateY(${(1-out((t-C)/.6))*70}px)`;
  $('qrBox').style.transform=`scale(${t<C+.4?0:back((t-C-.4)/.5)})`;
  $('sos').style.transform=`scale(${t<C+1?0:back((t-C-1)/.45)*(1+0.035*Math.sin((t-C-1)*7))})`;
  $('share').style.opacity=clamp((t-C-1.6)/.4);
  $('src').style.opacity=clamp((t-C-1.8)/.5)*.9;
  $('prog').style.width=(t/DUR*1080)+'px';
  // subtitles: [start,end,text] per scene, written by build_vo.py
  let cue=null; for(const s of SC) for(const c of (s.subt||[])) if(t>=c[0]&&t<c[1]) cue=c;
  if(cue){ const p=out((t-cue[0])/.12);
    const el=$('subt');
    if(el.textContent!==cue[2]){ el.textContent=cue[2]; el.style.fontSize='50px'; $('subWrap').style.display='flex';
      const w=el.scrollWidth; if(w>980) el.style.fontSize=(50*980/w).toFixed(1)+'px'; }   // one line, shrink to fit
    $('subWrap').style.cssText=`display:flex;opacity:${p};transform:translateY(${(1-p)*14}px)`; }
  else $('subWrap').style.display='none';
}
window.render=render; window.setTimeline=setTimeline;
</script>
</body></html>
